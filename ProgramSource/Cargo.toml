[workspace]
resolver = "3"
members = [
    "crates/vertex-ai-types",
    "crates/vertex-ai-provider",
    "crates/vertex-ai-provider-openai",
    "crates/vertex-ai-provider-ollama",
    "crates/vertex-ai-runtime",
    "crates/vertex-ai-runtime-postgres",
    "crates/vertex-ai-secrets",
    "crates/vertex-ai-audit",
    "crates/vertex-ai-memory",
    "crates/vertex-ai-context",
    "crates/vertex-ai-environment",
    "crates/vertex-ai-developer",
    "crates/vertex-ai-core",
    "apps/management-ui/src-tauri",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97.1"
license = "Proprietary"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.41", features = ["serde"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
fs2 = "0.4.3"
getrandom = "0.3.3"
httpmock = "0.8.2"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0.16"
similar = "2.7.0"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
zeroize = "1.8.1"
